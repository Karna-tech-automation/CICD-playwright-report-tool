name: Automated Performance Test

on:
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  run-perf-lens:
    runs-on: ubuntu-latest
    timeout-minutes: 15 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Caches the Chromium Browser binary so we don't download it every time
      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v1
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run Perf-Lens Headless Test
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" npm run perf-test
        env:
          TARGET_URL: "https://opensource-demo.orangehrmlive.com/"
          PERF_THROTTLE: "none"

      - name: Upload Performance Report Artifact
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: Perf-Lens-Report
          path: ci/ci-report.zip
          if-no-files-found: warn 
          retention-days: 14