name: Automated Performance Test

on:
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  run-perf-lens:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install
          npx playwright install chromium
          npx playwright install-deps chromium

      - name: Run Perf-Lens Headless Test
        run: npm run perf-test
        env:
          TARGET_URL: "https://opensource-demo.orangehrmlive.com/" # Change this to your staging URL

      - name: Upload Performance Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Perf-Lens-Report
          path: ci/ci-report.zip
          retention-days: 14